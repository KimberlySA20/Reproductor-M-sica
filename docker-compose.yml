version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: music-streamer-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: music-streamer
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  redis:
    image: redis:7.2-alpine
    container_name: music-streamer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: music-streamer-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/music-streamer?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./converted:/app/converted

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://admin:password@mongodb:27017/music-streamer?authSource=admin
      REDIS_URL: redis://redis:6379
      SERVER_URL: http://server:3001
    depends_on:
      - mongodb
      - redis
      - server
    volumes:
      - ./uploads:/app/uploads
      - ./converted:/app/converted
    deploy:
      replicas: 2

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: music-streamer-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongodb_data:
  redis_data:
